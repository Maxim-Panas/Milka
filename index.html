<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Dream Garden 🌸</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <div class="app">

    <!-- HEADER -->
    <header class="top-bar">
      <div class="title">🌸 Dream Garden</div>

      <div class="stats">
        <div class="stat">
          🌼 <span id="flowers">0</span>
        </div>
        <div class="stat">
          💰 <span id="coins">0</span>
        </div>
      </div>
    </header>

    <!-- MAIN GAME AREA -->
    <main class="game-area">

      <div class="garden" id="garden">
        🌿
      </div>

      <button class="big-button" id="growBtn">
        Натискай, щоб вирощувати 🌸
      </button>

      <p class="hint">
        Вирощуй сад і відкривай нові квіти ✨
      </p>

    </main>

    <!-- SHOP -->
    <section class="panel">
      <h2>Магазин 🏪</h2>

      <button class="shop-btn" id="buyFlower">
        Купити покращення (+1 до кліку) — 10 💰
      </button>

      <button class="shop-btn" id="buyAuto">
        Авто-рост (1/сек) — 50 💰
      </button>
    </section>

    <!-- ACHIEVEMENTS -->
    <section class="panel">
      <h2>Досягнення 🏆</h2>
      <ul id="achievements">
        <li>🌱 Посади 10 квітів</li>
        <li>🌸 Посади 100 квітів</li>
        <li>💰 Назбирай 500 монет</li>
      </ul>
    </section>

    <!-- FLOATING MESSAGE -->
    <div id="message" class="message hidden"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
