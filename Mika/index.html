<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Міла, ти моє серденько ✨</title>
    <!-- Підключаємо офіційний скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- МОБІЛЬНА СТИЛІЗАЦІЯ (CSS) --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; /* прибирає синій спалах при кліці на айфонах */
        }

        body {
            background: linear-gradient(180deg, #ffe5ec 0%, #ffc2d1 100%);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            padding: 20px;
            color: #4a4a4a;
        }

        /* Контейнер гри */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 360px; /* Ідеально для екранів смартфонів */
            text-align: center;
        }

        h1 {
            color: #ff477e;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .subtitle {
            font-size: 14px;
            color: #7d7d7d;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Магічне Серце (Ігровий елемент) */
        .magic-heart-zone {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .main-heart {
            font-size: 100px;
            cursor: pointer;
            transition: transform 0.3s ease;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(255, 71, 126, 0.4));
        }

        /* Анімація обертання під час "ворожіння" */
        .main-heart.spinning {
            animation: spinAndPulse 0.6s infinite linear;
        }

        @keyframes spinAndPulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        /* Блок з результатом */
        .prediction-box {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            box-shadow: 0 8px 25px rgba(251, 111, 146, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .prediction-box.show {
            transform: scale(1);
            opacity: 1;
        }

        .prediction-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 1.5;
            color: #ff477e;
        }

        /* Підказка внизу екрану */
        .footer-tip {
            font-size: 12px;
            color: #a3a3a3;
            margin-bottom: 10px;
        }

        /* Частинки для кліку */
        .heart-pop {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: popOut 1s ease-out forwards;
        }

        @keyframes popOut {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--mx), var(--my)) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 id="greeting">Для Міли з коханням 💜</h1>
        <p class="subtitle" id="sub">Торкнись серця, щоб отримати передбачення або таємне завдання</p>

        <!-- Інтерактивне серце -->
        <div class="magic-heart-zone">
            <div class="main-heart" id="heartBtn">💖</div>
        </div>

        <!-- Віконце результату -->
        <div class="prediction-box" id="resultBox">
            <p class="prediction-text" id="resultText">Тут з'явиться твоя магія...</p>
        </div>
    </div>

    <div class="footer-tip">Зроблено з думкою про тебе</div>

    <!-- --- ЛОГІКА ГРИ (JavaScript) --- -->
    <script>
        // Ініціалізація Telegram WebApp (щоб він адаптувався під тему ТГ і знав, що він у боті)
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортає додаток на весь екран телефону
        
        // Повідомляємо ТГ, який колір шапки зробити
        tg.setHeaderColor('#ffe5ec');

        const heartBtn = document.getElementById('heartBtn');
        const resultBox = document.getElementById('resultBox');
        const resultText = document.getElementById('resultText');
        
        // Список передбачень/ігрових квестів для Міли
        const lovePredictions = [
            "🔮 Сьогодні тебе чекає дуууже приємний сюрприз від однієї закоханої людини! 🥰",
            "💌 Завдання: Напиши автору цього бота три слова, які першими спадають на думку, коли ти про нього згадуєш.",
            "🧸 Зірки кажуть, що твої обійми сьогодні мають лікувальний ефект. Терміново потрібна практика!",
            "✨ Твоя врода сьогодні офіційно поза законом! Зменш рівень чарівності, бо серця навколо тануть. 👮‍♀️",
            "🌸 Передбачення: Наступна твоя кава чи чай принесе тобі неймовірну радісну новину.",
            "🎟️ Купон: Це повідомлення дає тобі право на безкоштовний масаж або смачну вечерю від автора! 😉",
            "🌕 Ти — чиєсь найтепліше сонечко навіть у похмурий день. Пам'ятай це!"
        ];

        let isSpinning = false;

        heartBtn.addEventListener('click', (e) => {
            if (isSpinning) return; // Захист від спам-кліків під час анімації
            
            isSpinning = true;
            heartBtn.classList.add('spinning');
            resultBox.classList.remove('show');
            
            // Створюємо вибух сердечок навколо великого серця
            createPopHearts(e);

            // Імітуємо "думання" кулі/серця (600 мілісекунд)
            setTimeout(() => {
                heartBtn.classList.remove('spinning');
                
                // Вибираємо випадковий варіант
                const randomIdx = Math.floor(Math.random() * lovePredictions.length);
                resultText.innerHTML = lovePredictions[randomIdx];
                
                // Показуємо результат з гарним випливанням
                resultBox.classList.add('show');
                
                // Робимо легку вібрацію на телефоні (якщо підтримується в ТГ)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
                isSpinning = false;
            }, 700);
        });

        // Функція створення ефекту вибуху дрібних сердечок на мобілці
        function createPopHearts(e) {
            const emojis = ['❤️', '💖', '💕', '✨', '🌸'];
            const rect = heartBtn.getBoundingClientRect();
            // Центр великого серця
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 10; i++) {
                const el = document.createElement('div');
                el.classList.add('heart-pop');
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Випадковий кут розльоту
                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 60;
                const mx = Math.cos(angle) * distance;
                const my = Math.sin(angle) * distance;

                el.style.setProperty('--mx', `${mx}px`);
                el.style.setProperty('--my', `${my}px`);
                
                el.style.left = `${centerX - 10}px`;
                el.style.top = `${centerY - 10}px`;

                document.body.appendChild(el);

                setTimeout(() => el.remove(), 1000);
            }
        }
    </script>
</body>
</html>
